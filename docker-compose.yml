services:
  searxng:
    build:
      context: ./searxng
      dockerfile: Dockerfile
    container_name: orio-search-searxng
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: orio-search-redis
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build: .
    container_name: orio-search-api
    expose:
      - "8000"
    depends_on:
      searxng:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ORIO_SEARCH_CONFIG=/app/config.yaml
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # CLIP image pre-filter for Aile Scape Game. Cuts the Qwen-VL
  # validate_image bill by ~50% (cheap CLIP cosine filters obvious
  # non-place images before the LLM call).
  clip-filter:
    build: ./clip-filter
    container_name: aile-clip-filter
    expose:
      - "8002"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1500M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
